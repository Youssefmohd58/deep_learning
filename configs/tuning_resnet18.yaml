# Hyperparameter search for ResNet-18 transfer learning (spec 5.8: Grid Search AND Random Search).
# Run:  python -m src.cli tune --config configs/tuning_resnet18.yaml
# Trials tune the head stage (the new classifier), which is where the learning rate matters most.
base: resnet18.yaml

tuning:
  epochs: 2                  # head-stage epochs per trial; fine-tune stage is skipped while tuning
  max_train_images: null
  max_val_images: null
  grid:
    head_lr: [0.0003, 0.001, 0.003]
    weight_decay: [0.0, 0.0001]
  random:
    trials: 6
    space:
      head_lr: {log_uniform: [0.0001, 0.005]}
      weight_decay: {log_uniform: [0.000001, 0.001]}
