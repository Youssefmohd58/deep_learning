# Member 3: ImageNet-pretrained ResNet-18 with a new 200-class head.
# Stage 1 trains only the new head; stage 2 also unfreezes the last residual stage (layer4).
base: data.yaml

model:
  architecture: resnet18
  pretrained: true

data:
  augmentation: transfer_mild
  batch_size: 32

training:
  strategy: transfer
  head_epochs: 3
  finetune_epochs: 3
  head_lr: 0.001
  finetune_lr: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.05
  grad_clip: null
  checkpoint_name: resnet18_best.pt
